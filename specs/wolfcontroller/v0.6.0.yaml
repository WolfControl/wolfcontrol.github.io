    # Nutrient Profiles

    NutrientEntry:
      type: object
      additionalProperties: false
      required:
        - chemicalName
        - ratio
      properties:
        chemicalName:
          type: string
          description: Name of the chemical or nutrient solution
          example: FloraGro
        ratio:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          description: Dosing rate in mL per gallon of water (must be > 0)
          example: 2.5

    NutrientProfile:
      type: object
      required:
        - id
        - name
        - nutrients
      properties:
        id:
          type: string
          readOnly: true
          description: Server-assigned unique identifier
          example: "507f1f77bcf86cd799439011"
        name:
          type: string
        description:
          type: string
          nullable: true
        nutrients:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/NutrientEntry"

    NutrientProfileCreate:
      type: object
      additionalProperties: false
      required:
        - name
        - nutrients
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        nutrients:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/NutrientEntry"

    NutrientProfileUpdate:
      type: object
      additionalProperties: false
      description: >
        PATCH semantics: omit a field to preserve it or provide a value to
        update it. Providing a nutrients array replaces the entire list (must
        be non-empty); omit to preserve existing nutrients.
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        nutrients:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/NutrientEntry"

    PaginatedNutrientProfiles:
      type: object
      required:
        - data
        - total
        - page
        - limit
        - totalPages
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/NutrientProfile"
        total:
          type: integer
          format: int32
          description: Total number of nutrient profiles
          example: 42
        page:
          type: integer
          format: int32
          description: Current page number (1-based)
          example: 1
        limit:
          type: integer
          format: int32
          description: Number of items per page
          example: 20
        totalPages:
          type: integer
          format: int32
          description: Total number of pages
          example: 3

    # PID Profiles

    PIDParams:
      type: object
      additionalProperties: false
      required:
        - kp
        - ki
        - kd
        - outputMin
        - outputMax
      properties:
        kp:
          type: number
          format: double
          minimum: 0
          description: Proportional gain (must be ≥ 0)
          example: 1.0
        ki:
          type: number
          format: double
          minimum: 0
          description: Integral gain (must be ≥ 0)
          example: 0.1
        kd:
          type: number
          format: double
          minimum: 0
          description: Derivative gain (must be ≥ 0)
          example: 0.01
        outputMin:
          type: number
          format: double
          description: Minimum controller output (must be < outputMax)
          example: -100.0
        outputMax:
          type: number
          format: double
          description: Maximum controller output (must be > outputMin)
          example: 100.0

    PIDProfile:
      type: object
      required:
        - id
        - name
        - params
      properties:
        id:
          type: string
          readOnly: true
          description: Server-assigned unique identifier
          example: "507f1f77bcf86cd799439011"
        name:
          type: string
        description:
          type: string
          nullable: true
        params:
          $ref: "#/components/schemas/PIDParams"

    PIDProfileCreate:
      type: object
      additionalProperties: false
      required:
        - name
        - params
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        params:
          $ref: "#/components/schemas/PIDParams"

    PIDProfileUpdate:
      type: object
      additionalProperties: false
      description: >
        PATCH semantics: omit a field to preserve it or provide a value to
        update it. Providing params replaces the entire tuning block (all 5
        fields required); omit to preserve existing params.
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        params:
          $ref: "#/components/schemas/PIDParams"

    PaginatedPIDProfiles:
      type: object
      required:
        - data
        - total
        - page
        - limit
        - totalPages
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PIDProfile"
        total:
          type: integer
          format: int32
          description: Total number of PID profiles
          example: 42
        page:
          type: integer
          format: int32
          description: Current page number (1-based)
          example: 1
        limit:
          type: integer
          format: int32
          description: Number of items per page
          example: 20
        totalPages:
          type: integer
          format: int32
          description: Total number of pages
          example: 3

    # Mesh Nodes

    NodeStatus:
      type: string
      readOnly: true
      description: >
        Connectivity, derived at read time rather than stored. A node's
        heartbeat writes a Redis key with a 60 s TTL every 10 s, so key
        expiry IS the offline detector — there is no status column to keep in
        sync and no writer that can drift from the truth.


        `pending` — no heartbeat yet, adopted recently enough that the device
        could still be rebooting and joining the mesh.

        `online` — heartbeat key present.

        `offline` — no heartbeat, and adoption is old enough that the device
        should have joined by now.

        `unknown` — the heartbeat store could not be reached, so connectivity
        could not be determined. The node's stored fields in the rest of the
        response are still accurate. Reporting `offline` here would blame the
        device for a backend fault, so the two are kept distinct: a client
        should render `unknown` as an indeterminate state, never as down.


        A node that never once joined is reported as `offline`, the same as one
        that ran for a month and lost power. Separating those requires recording
        the first successful join, which nothing writes today; it is deferred to
        the adoption flow, where that event actually happens.
      enum:
        - pending
        - online
        - offline
        - unknown

    NodeMeshState:
      type: object
      readOnly: true
      description: >
        Live mesh position, from the node's most recent heartbeat. Null when the
        node is not currently online — this is a snapshot of a live connection,
        not stored state.
      required:
        - staMac
        - apMac
        - hopCount
        - parentBssid
        - rssi
        - ip
      properties:
        staMac:
          type: string
          description: Station-interface MAC; the node's device ID derives from this
          example: "90:70:69:34:B6:8C"
        apMac:
          type: string
          description: SoftAP-interface MAC, which children see as the parent BSSID
          example: "90:70:69:34:B6:8D"
        hopCount:
          type: integer
          format: int32
          minimum: 0
          description: Depth in the mesh; 0 means uplinked directly to the upstream network
          example: 1
        parentBssid:
          type: string
          description: >
            BSSID of whatever this node's station interface is associated with.
            Never blank for a connected node: at depth 0 that is the upstream
            router itself, at any greater depth it is the parent node's SoftAP.
          example: "90:70:69:34:A1:2C"
        rssi:
          type: integer
          format: int32
          description: Signal strength to the parent, in dBm
          example: -62
        ip:
          type: string
          description: Address on the parent's subnet, assigned via the NAPT chain
          example: "192.168.4.2"

    Node:
      type: object
      description: An adopted mesh node.
      required:
        - deviceId
        - deviceType
        - status
        - adoptedAt
      properties:
        deviceId:
          type: string
          readOnly: true
          description: >
            Device-type prefix plus the 12-hex-digit STA MAC, derived on the
            device at boot and never stored there.
          example: WCSW90706934B68C
        deviceType:
          type: string
          readOnly: true
          description: >
            Hardware role, decoded from the device ID prefix. Reported as a
            string rather than a fixed enum: the production prefix table is set
            by a GPIO strap read that is not yet locked, and an enum would
            reject unknown hardware outright rather than surfacing it.
          example: WCSW
        name:
          type: string
          nullable: true
          description: Operator-assigned label, e.g. its physical location
          example: Res tank A
        status:
          $ref: "#/components/schemas/NodeStatus"
        firmwareVersion:
          type: string
          nullable: true
          readOnly: true
          description: >
            Last confirmed firmware version, persisted rather than read live, so
            it survives the node going offline — the version a node was running
            when it stopped responding is exactly what you want while working out
            why. Also what fleet OTA plans against, since a campaign has to
            include nodes that are currently offline.


            Written at adoption from the BLE advertisement and updated when an
            OTA is confirmed. Null until the node has been adopted through that
            flow.
          example: 0.4.1
        adoptedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the node acked its credential bundle over BLE
        mesh:
          allOf:
            - $ref: "#/components/schemas/NodeMeshState"
          nullable: true

    NodeUpdate:
      type: object
      additionalProperties: false
      description: >
        PATCH semantics: omit a field to preserve it, set to null to clear it,
        or provide a value to update it.
      properties:
        name:
          type: string
          nullable: true
          description: Operator-assigned label. Null clears it.
          example: Res tank A

    NodeAdopt:
      type: object
      additionalProperties: false
      description: >
        The device ID comes from the path. Nothing about the bundle is settable
        here — it is install-wide configuration, so that adopting two nodes
        cannot silently put them on different networks.
      properties:
        name:
          type: string
          nullable: true
          description: >
            Optional operator-assigned label to record with the adoption. Must
            be unique across adopted nodes if supplied.
          example: Res tank A

    PaginatedNodes:
      type: object
      required:
        - data
        - total
        - page
        - limit
        - totalPages
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Node"
        total:
          type: integer
          format: int32
          description: Total number of adopted nodes
          example: 12
        page:
          type: integer
          format: int32
          description: Current page number (1-based)
          example: 1
        limit:
          type: integer
          format: int32
          description: Number of items per page
          example: 20
        totalPages:
          type: integer
          format: int32
          description: Total number of pages
          example: 1

    DiscoveredNode:
      type: object
      readOnly: true
      description: >
        A node seen advertising for adoption. Not a stored resource — this is a
        transient observation, valid only around the moment of the scan.
      required:
        - deviceId
        - deviceType
        - rssi
      properties:
        deviceId:
          type: string
          description: The node's derived device ID, taken from its advertised name
          example: WCSW90706934B68C
        deviceType:
          type: string
          description: Hardware role, decoded from the device ID prefix
          example: WCSW
        firmwareVersion:
          type: string
          nullable: true
          description: >
            Version from the node's BLE scan response. Advisory — it is
            budget-limited on the wire and truncates rather than failing.
          example: 0.4.1
        rssi:
          type: integer
          format: int32
          description: >
            Advertisement signal strength in dBm, as seen by the appliance. A
            proxy for proximity, useful for telling apart two identical nodes.
          example: -47

    DiscoveredNodes:
      type: object
      required:
        - data
        - scannedFor
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DiscoveredNode"
        scannedFor:
          type: integer
          format: int32
          description: How long the scan actually ran, in seconds
          example: 5

    # Install configuration

    InstallNetwork:
      type: object
      description: >
        The credential bundle handed to nodes at adoption. Passphrases are
        write-only and are never present in a response.
      required:
        - rootConfigured
        - meshConfigured
      properties:
        rootSsid:
          type: string
          nullable: true
          description: SSID of the upstream network nodes uplink to
          example: HomeNetwork
        rootConfigured:
          type: boolean
          readOnly: true
          description: Whether an upstream passphrase is stored
        meshSsid:
          type: string
          nullable: true
          readOnly: true
          description: >
            SSID every node beacons for the mesh itself. Generated once per
            install and immutable — rotating it would strand every adopted node.
          example: wolf-mesh-a1b2c3
        meshConfigured:
          type: boolean
          readOnly: true
          description: Whether the mesh credentials have been generated
        mqttUri:
          type: string
          nullable: true
          description: Broker URI nodes connect to
          example: mqtt://192.168.1.10:1883

    InstallNetworkUpdate:
      type: object
      additionalProperties: false
      description: >
        Full replacement of the upstream configuration. Mesh credentials are
        generated by the backend and cannot be set here.
      required:
        - rootSsid
        - rootPass
        - mqttUri
      properties:
        rootSsid:
          type: string
          minLength: 1
          maxLength: 32
          description: SSID of the upstream network nodes uplink to
          example: HomeNetwork
        rootPass:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 63
          description: >
            WPA2 passphrase for the upstream network. Length limits are the WPA2
            range the firmware validates against before storing; open networks
            are not supported.
        mqttUri:
          type: string
          minLength: 1
          description: Broker URI nodes connect to
          example: mqtt://192.168.1.10:1883
