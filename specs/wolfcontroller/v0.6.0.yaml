openapi: 3.0.0
info:
  title: WolfControl API - OpenAPI 3.0
  description: |-
    Local API for monitoring and state management of WolfControl clients.
  version: v0.6.0
tags:
  - name: state-profiles
    description: Desired state profile management
  - name: nutrient-profiles
    description: Nutrient dosing profile management
  - name: pid-profiles
    description: PID controller profile management
  - name: nodes
    description: Mesh node lifecycle — discovery, adoption, and state
  - name: install
    description: Per-install network configuration pushed to nodes during adoption

paths:
  /state-profiles:
    get:
      tags:
        - state-profiles
      operationId: ListStateProfiles
      summary: Get a list of all state profiles
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: A paginated list of state profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedStateProfiles"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - state-profiles
      operationId: CreateStateProfile
      summary: Create a new state profile
      description: >
        Creates a new state profile. Settings and individual target fields are
        optional — omitted fields mean this profile does not manage that target.
        Provided values are rounded to 2 decimal places.
      requestBody:
        description: State profile object to be created
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StateProfileCreate"
      responses:
        "201":
          description: The created state profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /state-profiles/{id}:
    get:
      tags:
        - state-profiles
      operationId: GetStateProfile
      summary: Get a single state profile by ID
      parameters:
        - $ref: "#/components/parameters/StateProfileID"
      responses:
        "200":
          description: A single state profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateProfile"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags:
        - state-profiles
      operationId: UpdateStateProfile
      summary: Update a state profile by ID
      description: >
        Omit a field to preserve it. Set a settings field to null to clear that
        target. Provide a value to update it. Values are rounded to 2 decimal places.
      parameters:
        - $ref: "#/components/parameters/StateProfileID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StateProfileUpdate"
      responses:
        "200":
          description: The updated state profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - state-profiles
      operationId: DeleteStateProfile
      summary: Delete a state profile by ID
      parameters:
        - $ref: "#/components/parameters/StateProfileID"
      responses:
        "204":
          description: State profile deleted successfully
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /nutrient-profiles:
    get:
      tags:
        - nutrient-profiles
      operationId: ListNutrientProfiles
      summary: Get a list of all nutrient profiles
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: A paginated list of nutrient profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedNutrientProfiles"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - nutrient-profiles
      operationId: CreateNutrientProfile
      summary: Create a new nutrient profile
      description: >
        Creates a new nutrient profile. Nutrients is an optional list of chemicals
        and their dosing rates in mL per gallon.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NutrientProfileCreate"
      responses:
        "201":
          description: The created nutrient profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NutrientProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /nutrient-profiles/{id}:
    get:
      tags:
        - nutrient-profiles
      operationId: GetNutrientProfile
      summary: Get a single nutrient profile by ID
      parameters:
        - $ref: "#/components/parameters/NutrientProfileID"
      responses:
        "200":
          description: A single nutrient profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NutrientProfile"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags:
        - nutrient-profiles
      operationId: UpdateNutrientProfile
      summary: Update a nutrient profile by ID
      description: >
        Omit a field to preserve it. Set description or nutrients to null to clear
        them. Providing a nutrients array replaces the entire list.
      parameters:
        - $ref: "#/components/parameters/NutrientProfileID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NutrientProfileUpdate"
      responses:
        "200":
          description: The updated nutrient profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NutrientProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - nutrient-profiles
      operationId: DeleteNutrientProfile
      summary: Delete a nutrient profile by ID
      parameters:
        - $ref: "#/components/parameters/NutrientProfileID"
      responses:
        "204":
          description: Nutrient profile deleted successfully
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /pid-profiles:
    get:
      tags:
        - pid-profiles
      operationId: ListPIDProfiles
      summary: Get a list of all PID profiles
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: A paginated list of PID profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPIDProfiles"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - pid-profiles
      operationId: CreatePIDProfile
      summary: Create a new PID profile
      description: >
        Creates a new PID profile. Both name and params are required. All params
        fields (kp, ki, kd, outputMin, outputMax) must be provided.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PIDProfileCreate"
      responses:
        "201":
          description: The created PID profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PIDProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /pid-profiles/{id}:
    get:
      tags:
        - pid-profiles
      operationId: GetPIDProfile
      summary: Get a single PID profile by ID
      parameters:
        - $ref: "#/components/parameters/PIDProfileID"
      responses:
        "200":
          description: A single PID profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PIDProfile"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags:
        - pid-profiles
      operationId: UpdatePIDProfile
      summary: Update a PID profile by ID
      description: >
        Omit a field to preserve it. Set params to null to clear it. Provide params
        to replace the entire tuning block — all 5 fields are required when provided.
      parameters:
        - $ref: "#/components/parameters/PIDProfileID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PIDProfileUpdate"
      responses:
        "200":
          description: The updated PID profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PIDProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - pid-profiles
      operationId: DeletePIDProfile
      summary: Delete a PID profile by ID
      parameters:
        - $ref: "#/components/parameters/PIDProfileID"
      responses:
        "204":
          description: PID profile deleted successfully
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # Mesh nodes
  #
  # A node record exists in this API only once adopted: adoption over BLE IS
  # the claim (mesh docs/PROVISIONING.md). Unadopted hardware is not a resource
  # — it is a transient scan result from /discover/nodes.

  /discover/nodes:
    get:
      tags:
        - nodes
      operationId: DiscoverNodes
      summary: Scan for unadopted nodes advertising over BLE
      description: >
        Runs a bounded BLE scan on the appliance and returns the nodes currently
        advertising for adoption. Synchronous: a scan is seconds of work and its
        result is worthless once stale, so there is no job to poll and nothing is
        persisted. Unadopted nodes advertise continuously, so re-scanning is
        free and idempotent. The appliance has a single Bluetooth adapter — a
        scan requested while another scan or adoption holds it returns 409.


        A 500 here is not necessarily a fault in the appliance: Bluetooth is a
        radio, and a weak or congested link fails in ways that are indistinguishable
        from a defect at this layer. Retrying is reasonable. Persistent failures
        with nodes known to be advertising are usually signal, not software —
        check placement and antennas before suspecting the backend.
      parameters:
        - $ref: "#/components/parameters/ScanDurationParam"
      responses:
        "200":
          description: The nodes seen advertising during the scan window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveredNodes"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /nodes:
    get:
      tags:
        - nodes
      operationId: ListNodes
      summary: Get a list of all adopted nodes
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: A paginated list of adopted nodes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedNodes"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /nodes/{deviceId}:
    get:
      tags:
        - nodes
      operationId: GetNode
      summary: Get a single adopted node by device ID
      parameters:
        - $ref: "#/components/parameters/DeviceID"
      responses:
        "200":
          description: A single adopted node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags:
        - nodes
      operationId: UpdateNode
      summary: Update the operator-assigned fields of a node
      description: >
        Only operator-assigned metadata is writable. Identity (device ID, type)
        is derived on the device and never settable, and connectivity state is
        derived from heartbeats rather than stored. Omit a field to preserve it,
        or set it to null to clear it.


        `name` must be unique across adopted nodes — renaming onto a name
        another node holds returns 409. Clearing it does not conflict: the
        label is optional, so any number of nodes may go unnamed.
      parameters:
        - $ref: "#/components/parameters/DeviceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeUpdate"
      responses:
        "200":
          description: The updated node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - nodes
      operationId: DeleteNode
      summary: Remove a node from this install and clear its credentials
      description: >
        Publishes `forget` to the device, then removes the node record, in that
        order. Both happen in one operation so that a caller cannot create the
        ghost state by forgetting a second request: a deleted record whose
        device still holds valid credentials keeps running, keeps heartbeating,
        and is not adoptable by anyone.


        Requires the node to be online so the `forget` command can reach it. The
        command is published at QoS 1 and the record is removed once the broker
        accepts it; the device erases its bundle, reboots, and returns to
        advertising for adoption. Calibration NVS survives.


        An offline node returns 409. Use `force=true` to delete the record
        anyway, for hardware that is dead or permanently gone — this leaves any
        still-living device provisioned, and it must then be cleared with the
        physical recovery button before it can be adopted again.


        A node adopted within the last few minutes that has not heartbeated yet
        also returns 409, but for the opposite reason and with different advice:
        it is still rebooting and joining the mesh, and it should be waited for.
        **Do not use `force=true` on it.** That deletes the record of a device
        that is alive and about to arrive, leaving it provisioned, unadoptable,
        and recoverable only at the hardware. The two cases are distinguishable
        by their message.


        503 covers the two retryable failures, and is distinct from 500 in that
        neither needs anything reconfigured or redeployed: connectivity could not
        be determined because the heartbeat store was unreachable, or the command
        could not be delivered to the broker.


        The record is removed only after the broker accepts the command. If that
        publish succeeds and the record deletion then fails, the device clears
        itself while its record survives; the 500 returned in that case says so
        and names `force=true` as the repair, because a plain retry cannot work
        once the device has stopped heartbeating.
      parameters:
        - $ref: "#/components/parameters/DeviceID"
        - $ref: "#/components/parameters/ForceParam"
      responses:
        "204":
          description: Node removed successfully
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /nodes/{deviceId}/adopt:
    post:
      tags:
        - nodes
      operationId: AdoptNode
      summary: Adopt a discovered node by provisioning it over BLE
      description: >
        Opens an encrypted protocomm session to the advertising node and writes
        the install credential bundle. Synchronous through the device's ack —
        that ack is an authenticated, in-band confirmation that the bundle was
        stored, which is why no MQTT acknowledgement topic exists or is needed.


        Returns 201 as soon as the node acks, normally with status `pending`. It
        does NOT wait for the node to join the mesh: the device reboots, scans,
        joins, and connects to the broker on its own schedule. Observe that second
        half by polling this node's `status`, which flips to `online` once
        heartbeats appear and to `offline` if they never do.


        One exception: a node forgotten and re-adopted within the heartbeat TTL
        (60 s) reports `online` straight away, because the key written by its
        previous incarnation has not expired yet. Status is derived from whether a
        heartbeat key exists, and one does. It resolves itself within the TTL.


        Requires the Bluetooth adapter — returns 409 while another scan or
        adoption holds it, if this node is already adopted, or if `name` is
        already held by another node. Returns 422 when the node itself rejects
        the bundle, and 424 when this install has no network configuration to
        hand out yet.


        The name conflict is checked before the device is touched, so a
        rejected adoption leaves the hardware unprovisioned and still
        advertising.


        A 500 covers transient BLE failures as well as genuine faults, and the two
        are not reliably separable at this layer. A weak link can fail at any stage
        — the connection never completing, the link dropping mid-discovery, or the
        device's own stack refusing a write — and each surfaces as a 500 with a
        different message in the appliance log. Nothing is persisted on the device
        unless it acknowledges the bundle, so retrying is always safe. Repeated
        failures against a node that discovery can see are far more often signal
        strength than software; onboarding is designed for the device to be near
        the appliance.
      parameters:
        - $ref: "#/components/parameters/DeviceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeAdopt"
      responses:
        "201":
          description: The node acked the bundle and is now adopted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: No node with this device ID is currently advertising
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "424":
          $ref: "#/components/responses/FailedDependency"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # Install network configuration

  /install/network:
    get:
      tags:
        - install
      operationId: GetInstallNetwork
      summary: Get the install network configuration
      description: >
        Passphrases are never returned. The `configured` booleans report whether
        each passphrase is set without disclosing it.
      responses:
        "200":
          description: The install network configuration, with passphrases redacted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallNetwork"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags:
        - install
      operationId: SetInstallNetwork
      summary: Set the upstream network credentials for this install
      description: >
        Sets the upstream network credentials, plus the broker URI. Every node is
        root-capable, so every node carries these values and any of them may use
        them to uplink. A full replacement rather than a PATCH, deliberately:
        these values are handed to devices as one bundle, and a partially-updated
        bundle is not a meaningful thing to store.


        This call does NOT reach already-adopted nodes, by design. BLE
        provisioning is the only path that writes credentials to a device, and it
        stays that way on purpose: a passphrase push over MQTT would put the
        user's network credentials in cleartext across the mesh and the LAN,
        whereas the BLE session is encrypted and authenticated point-to-point.
        Changing these values therefore requires re-provisioning each node — the
        same bargain as any consumer WiFi device whose network password changes.
        Nodes holding the old bundle simply drop offline once the upstream
        network changes under them, and come back as they are re-provisioned.


        The mesh SSID and passphrase are not settable. They are generated once
        per install on first start and are immutable thereafter: rotating them
        would strand every adopted node simultaneously, with no path back except
        the physical recovery button on each device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallNetworkUpdate"
      responses:
        "200":
          description: The updated install network configuration, with passphrases redacted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallNetwork"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  parameters:
    StateProfileID:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: The unique ID of the state profile

    NutrientProfileID:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: The unique ID of the nutrient profile

    PIDProfileID:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: The unique ID of the PID profile

    PageParam:
      in: query
      name: page
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
      description: Page number to retrieve (1-based)

    LimitParam:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
      description: Number of items per page (max 100)

    DeviceID:
      in: path
      name: deviceId
      required: true
      schema:
        type: string
        pattern: "^[A-Z]{2,6}[0-9A-F]{12}$"
      description: >
        The node's derived device ID — a device-type prefix followed by the
        12-hex-digit STA MAC. Derived on the device at every boot and never
        stored there, so it is stable for the life of the hardware. Note this is
        the device's own identifier, not a server-assigned ObjectID.
      example: WCSW90706934B68C

    ScanDurationParam:
      in: query
      name: duration
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 30
        default: 5
      description: >
        How long to scan, in seconds. The request blocks for this long. Longer
        windows catch nodes at weaker signal at the cost of holding the adapter.

    ForceParam:
      in: query
      name: force
      required: false
      schema:
        type: boolean
        default: false
      description: >
        Delete the record without contacting the device. For hardware that is
        dead or gone; leaves a still-living device provisioned and unadoptable
        until cleared with its physical recovery button.

  responses:
    BadRequest:
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    Forbidden:
      description: Operation not permitted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    UnprocessableEntity:
      description: The device rejected the request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    FailedDependency:
      description: A prerequisite of this operation is not configured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    ServiceUnavailable:
      description: >
        A capability this operation needs is not present on the appliance right
        now. Distinct from 409, which means the resource exists and is held by
        someone else, and from 500, which means something malfunctioned. Retrying
        may succeed without anything being reconfigured or redeployed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
  schemas:
    APIError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: Application-level error code
        message:
          type: string
          description: Human-readable error description

    # State Profiles

    StateProfileSettings:
      type: object
      additionalProperties: false
      properties:
        ph:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          maximum: 14
          description: Desired pH level (must be > 0 and ≤ 14)
          example: 6.2
        ec:
          type: number
          format: double
          minimum: 0
